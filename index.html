<!DOCTYPE html>
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


<title>PA#1 - Klein Bottle Wireframe</title>
<style>
    body {
        background-color: #EEEEEE;
        font-family: Arial, sans-serif;
        margin: 20px;
    }
    .controls {
        margin: 20px 0;
    }
    .control-group {
        margin: 10px 0;
    }
    label {
        display: inline-block;
        width: 150px;
    }
    input[type="range"] {
        width: 200px;
    }
    .value-display {
        display: inline-block;
        width: 50px;
        text-align: center;
        font-weight: bold;
    }
</style>

<script src="./Utils/trackball-rotator.js"></script>
<script src="./Utils/m4.js"></script>
<script src="./shader.gpu"></script>
<script src="./model.js"></script>
<script src="./TextureHandler.js"></script>
<script src="./main.js"></script>

</head>
<body onload="init()">

<h2>Klein Bottle Wireframe Visualization</h2>

<p id="message">Drag your mouse on the canvas to rotate the view.<br>
(On a touch screen, you can use your finger.)</p>

<div class="controls">
    <div class="control-group">
        <label for="nuSlider">U-segments (nu):</label>
        <input type="range" id="nuSlider" min="8" max="128" value="64" step="8">
        <span class="value-display" id="nuValue">64</span>
    </div>
    <div class="control-group">
        <label for="nvSlider">V-segments (nv):</label>
        <input type="range" id="nvSlider" min="4" max="64" value="32" step="4">
        <span class="value-display" id="nvValue">32</span>
    </div>
    <div class="control-group">
        <label for="zoomSlider">Zoom:</label>
        <input type="range" id="zoomSlider" min="3" max="50" value="10" step="0.5">
        <span class="value-display" id="zoomValue">10.0</span>
    </div>
</div>

<div id="canvas-holder">
   <canvas width="600" height="600" id="webglcanvas" style="background-color:#000000"></canvas>
</div>

<p style="margin-top: 20px; color: #666;">
    <span style="color: #0ff;">Cyan lines</span> are U-lines (fixed v, varying u).<br>
    <span style="color: #f0f;">Magenta lines</span> are V-lines (fixed u, varying v).
</p>

</body></html>
